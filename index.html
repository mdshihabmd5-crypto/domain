<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain For Sale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #000000;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1);
            border: 1px solid #222222;
            max-width: 450px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            color: #ffffff;
            font-size: 26px;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
        }
        p {
            color: #aaaaaa;
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.5;
            text-align: center;
            width: 100%;
        }
        .btn {
            background-color: #ffffff;
            color: #000000;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.2s;
            text-align: center;
        }
        .btn:hover {
            background-color: #dddddd;
        }
        .verify-box {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #222222;
            font-size: 13px;
            color: #777777;
            text-align: center;
            width: 100%;
        }
        .verify-box strong {
            color: #ffffff;
            word-break: break-all;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>This Domain is For Sale</h1>
        <p>If you are interested in acquiring or purchasing this domain, please feel free to reach out.</p>
        
        <!-- Direct Mailto Button -->
        <a href="mailto:get.domain.uk@gmail.com?subject=Domain Acquisition Inquiry" class="btn">Contact Us</a>

        <!-- Official Contact Email for Verification -->
        <div class="verify-box">
            Official Owner Email:<br>
            <strong>get.domain.uk@gmail.com</strong>
        </div>
    </div>
</body>
</html>
